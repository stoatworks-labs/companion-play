# companion-play display configuration.
#
# Sourced by /usr/local/bin/companion-play-session. Restart the display with
#   systemctl restart companion-kiosk

# The first tab. Companion's admin UI on the loopback.
KIOSK_URL="http://127.0.0.1:8000/"

# Additional tabs, space separated. Web-button pages go here — for example the
# tablet view of a page:
#   KIOSK_EXTRA_URLS="http://127.0.0.1:8000/tablet?pages=1 http://127.0.0.1:8000/tablet?pages=2"
KIOSK_EXTRA_URLS=""

# Chromium's GPU path. "off" (the default) because the PLAY's Mali-450 is
# GLES2-only and buys nothing for a DOM-only UI, and because a broken GL stack
# presents as a blank window rather than an error. Set to "on" only to test.
KIOSK_GPU="off"

# Hide the mouse pointer after 3 idle seconds. For a touch-only install. Leave
# at 0 when a keyboard and mouse are attached.
KIOSK_HIDE_CURSOR="0"

# Force a window size, e.g. "1920,1080". Empty means let X decide from the
# attached display's mode.
KIOSK_WINDOW_SIZE=""
